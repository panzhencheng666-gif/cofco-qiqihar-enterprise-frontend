server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Identity is established only by the Backend OIDC/HttpOnly session. Never
  # carry local or legacy identity headers across this proxy boundary.
  proxy_set_header X-Actor "";
  proxy_set_header X-Qiqihar-Authenticated-Subject "";
  proxy_set_header X-Authenticated-Subject "";
  proxy_set_header X-Remote-User "";

  location = /healthz {
    access_log off;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /actuator/ {
    proxy_pass http://backend:8090;
    proxy_http_version 1.1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
