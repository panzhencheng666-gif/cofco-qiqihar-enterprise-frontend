server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:8090;
    proxy_http_version 1.1;
    # proxy_set_header inheritance is all-or-nothing in Nginx. Keep identity
    # clearing in every proxy location that also defines forwarding headers.
    proxy_set_header X-Actor "";
    proxy_set_header X-Qiqihar-Authenticated-Subject "";
    proxy_set_header X-Authenticated-Subject "";
    proxy_set_header X-Remote-User "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /actuator/ {
    proxy_pass http://backend:8090;
    proxy_http_version 1.1;
    proxy_set_header X-Actor "";
    proxy_set_header X-Qiqihar-Authenticated-Subject "";
    proxy_set_header X-Authenticated-Subject "";
    proxy_set_header X-Remote-User "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
